services:
  - type: web
    name: imessage-github-ai-chatbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app/main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.19
      - key: PORT
        value: 10000
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
